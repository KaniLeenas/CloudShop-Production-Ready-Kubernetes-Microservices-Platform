name: CloudShop CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build-and-test:

    name: Build and Test CloudShop

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloudshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cloudshop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test Auth Service
        working-directory: auth-service
        env:
          DB_URL: jdbc:postgresql://localhost:5432/cloudshop
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: mvn -B clean test

      - name: Build and test Product Service
        working-directory: product-service
        env:
          DB_URL: jdbc:postgresql://localhost:5432/cloudshop
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: mvn -B clean test

      - name: Build and test Order Service
        working-directory: order-service
        env:
          DB_URL: jdbc:postgresql://localhost:5432/cloudshop
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: mvn -B clean test


  docker-build:
    name: Build CloudShop Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Auth Service image
        run: |
          docker build \
            -t cloudshop/auth-service:${{ github.sha }} \
            ./auth-service

      - name: Build Product Service image
        run: |
          docker build \
            -t cloudshop/product-service:${{ github.sha }} \
            ./product-service

      - name: Build Order Service image
        run: |
          docker build \
            -t cloudshop/order-service:${{ github.sha }} \
            ./order-service

  security-scan:

    name: Scan Docker Images with Trivy

    needs:
      - docker-build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Auth Service image
        run: |
          docker build \
            -t cloudshop/auth-service:${{ github.sha }} \
            ./auth-service

      - name: Build Product Service image
        run: |
          docker build \
            -t cloudshop/product-service:${{ github.sha }} \
            ./product-service

      - name: Build Order Service image
        run: |
          docker build \
            -t cloudshop/order-service:${{ github.sha }} \
            ./order-service

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.5

      - name: Scan Auth Service
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            cloudshop/auth-service:${{ github.sha }}

      - name: Scan Product Service
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            cloudshop/product-service:${{ github.sha }}

      - name: Scan Order Service
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            cloudshop/order-service:${{ github.sha }}
